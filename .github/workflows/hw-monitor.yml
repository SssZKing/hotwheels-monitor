name: Hot Wheels stock monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email instead of checking the store"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency: hw-monitor
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check store
        env:
          HW_GMAIL_USER: ${{ secrets.HW_GMAIL_USER }}
          HW_GMAIL_APP_PASSWORD: ${{ secrets.HW_GMAIL_APP_PASSWORD }}
          HW_EMAIL_TO: ${{ secrets.HW_GMAIL_USER }}
          HW_WATCH_SKUS: ${{ vars.HW_WATCH_SKUS }}
        # Each run checks once a minute for ~4.5 minutes, then the next 5-minute run takes over.
        run: python3 hw_monitor.py ${{ inputs.test_email && '--test' || '--loop 60 --for 270' }}
      - name: Save state
        run: |
          git config user.name "hw-monitor"
          git config user.email "hw-monitor@users.noreply.github.com"
          git add hw_state.json docs/stock.json
          git diff --cached --quiet || (git commit -m "Update stock state" && git pull --rebase -q origin main && git push)
      # Keep the Actions tab tidy: delete finished runs beyond the newest 20.
      - name: Clean up old runs
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/hw-monitor.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[20:][].id' |
          while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true; done
      # GitHub's scheduler isn't firing for this repo, so each run starts the next one.
      # Set the repository variable HW_CHAIN to "off" to stop the chain.
      - name: Start next run
        if: ${{ !cancelled() && !inputs.test_email && vars.HW_CHAIN != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hw-monitor.yml --repo "${{ github.repository }}" --ref main
